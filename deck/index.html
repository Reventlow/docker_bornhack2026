document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 1; } 50%, 100% { opacity: 0; } }\n<\/style>\n<\/helmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"f3f58713-9528-4d3b-9451-2ca75cd83010#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-uneditable=\"\">\n\n  <!-- ══════════ 1 · TITLE ══════════ -->\n  <section data-label=\"Title\" data-screen-label=\"Title\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 26px var(--mono); color: var(--green); letter-spacing: 0.1em;\">docker workshop · two hours · bring a laptop<\/div>\n    <div style=\"margin-top: 120px;\">\n      <h1 style=\"margin: 0; font: 800 118px/1.08 var(--mono); letter-spacing: -0.02em; color: var(--ink);\">Docker for<br>the Curious<span style=\"display: inline-block; width: 30px; height: 86px; background: var(--ink); margin-left: 22px; animation: blink 1.1s steps(1) infinite;\"><\/span><\/h1>\n      <p style=\"margin: 44px 0 0; font: 400 36px/1.5 var(--sans); color: var(--soft); max-width: 1100px;\">Containers from absolute zero. No prior experience, no Linux wizardry — a hands-on two hours.<\/p>\n    <\/div>\n    <div style=\"margin-top: auto; max-width: 760px;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n        <div style=\"display: flex; align-items: center; gap: 9px; padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line);\">\n          <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n          <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n          <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n          <span style=\"margin-left: 10px; font: 500 24px var(--mono); color: var(--dim);\">you@laptop:~<\/span>\n        <\/div>\n        <pre style=\"margin: 0; padding: 24px 28px; font: 500 26px/1.8 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> whoami\n<span style=\"color: var(--dim);\">gorm reventlow<\/span><\/pre>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: 36px; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 2 · ABOUT ══════════ -->\n  <section data-label=\"About\" data-screen-label=\"Who is talking\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## whoami<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Gorm Reventlow<\/h1>\n    <div style=\"margin-top: 52px; display: grid; grid-template-columns: 520px 1fr; gap: 72px; align-items: center;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; height: 700px;\">\n        <img src=\"./assets/gorm-portrait.jpg\" alt=\"Gorm Reventlow\" style=\"display: block; width: 100%; height: 100%; object-fit: cover;\">\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 36px;\">\n        <div style=\"display: flex; gap: 24px;\">\n          <span style=\"font: 700 30px var(--mono); color: var(--green);\">&gt;<\/span>\n          <p style=\"margin: 0; font: 400 30px/1.55 var(--sans); color: var(--soft);\">Systems administrator at <span style=\"font: 500 28px var(--mono); color: var(--ink);\">FynBus<\/span>, the regional bus company on Funen. My days are mostly <em>compliance<\/em>: NIS2, ISO, governance and documentation.<\/p>\n        <\/div>\n        <div style=\"display: flex; gap: 24px;\">\n          <span style=\"font: 700 30px var(--mono); color: var(--green);\">&gt;<\/span>\n          <p style=\"margin: 0; font: 400 30px/1.55 var(--sans); color: var(--soft);\">Open source by conviction — Linux on everything I own, and I would rather run a thing myself than rent it from someone else.<\/p>\n        <\/div>\n        <div style=\"display: flex; gap: 24px;\">\n          <span style=\"font: 700 30px var(--mono); color: var(--green);\">&gt;<\/span>\n          <p style=\"margin: 0; font: 400 30px/1.55 var(--sans); color: var(--soft);\">A homelab that keeps growing: containers and a long list of services I did not strictly need.<\/p>\n        <\/div>\n        <div style=\"margin-top: 8px; font: 500 26px/1.7 var(--mono); color: var(--dim);\"># which is roughly how two hours about docker came about<\/div>\n        <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 34px; display: grid; grid-template-columns: auto 1fr; gap: 14px 30px; align-items: baseline;\">\n          <span style=\"font: 700 24px var(--mono); color: var(--green);\">mail<\/span><span style=\"font: 500 26px var(--mono); color: var(--ink);\">gorm@reventlow.com<\/span>\n          <span style=\"font: 700 24px var(--mono); color: var(--green);\">phone<\/span><span style=\"font: 500 26px var(--mono); color: var(--ink);\">+45 20 52 93 67<\/span>\n          <span style=\"font: 700 24px var(--mono); color: var(--green);\">pgp<\/span><span style=\"font: 500 22px/1.5 var(--mono); color: var(--soft);\">51A4 B85B ECF7 11F0 8F7A&nbsp;&nbsp;0030 6205 1D12 C4FA 0DD9<br><span style=\"color: var(--dim);\">reventlow.com/gorm-reventlow.asc<\/span><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 3 · FORMAT ══════════ -->\n  <section data-label=\"Format\" data-screen-label=\"How the next two hours work\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## format<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">How the Next Two Hours Work<\/h1>\n    <div style=\"margin-top: 64px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 36px;\">\n        <div style=\"font: 700 34px var(--mono); color: var(--green);\">50 / 50<\/div>\n        <p style=\"margin: 22px 0 0; font: 400 29px/1.55 var(--sans); color: var(--soft);\">Half explaining, half typing. When a slide has an amber <span style=\"font: 700 26px var(--mono); color: #3a4433; background: var(--amber); padding: 3px 12px; border-radius: 5px;\">TASK<\/span> badge, it’s hands-on-keyboard time.<\/p>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 36px;\">\n        <div style=\"font: 700 34px var(--mono); color: var(--green);\">8 tasks<\/div>\n        <p style=\"margin: 22px 0 0; font: 400 29px/1.55 var(--sans); color: var(--soft);\">Each one builds on the last. Finished early? Help the people around you — that’s the fastest way to learn it twice.<\/p>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 36px;\">\n        <div style=\"font: 700 34px var(--mono); color: var(--green);\">stuck?<\/div>\n        <p style=\"margin: 22px 0 0; font: 400 29px/1.55 var(--sans); color: var(--soft);\">Raise a hand — I’ll come around. No laptop with you? Pair up with a neighbor and share a keyboard.<\/p>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: 56px; font: 500 26px/1.7 var(--mono); color: var(--dim);\"># prerequisites: curiosity (required) · coffee or favorite beverage (recommended)<\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 4 · WHY ══════════ -->\n  <section data-label=\"Why\" data-screen-label=\"Why containers exist\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## concepts<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Why Containers Exist<\/h1>\n    <div style=\"margin-top: 64px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 56px 48px;\">\n        <div style=\"font: 700 52px/1.3 var(--mono); color: var(--ink);\">“But it works<br>on <span style=\"color: var(--green);\">my<\/span> machine…”<\/div>\n        <div style=\"margin-top: 32px; font: 400 27px var(--sans); color: var(--dim);\">— every developer, right before a deadline<\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 40px;\">\n        <div style=\"display: flex; gap: 24px;\">\n          <span style=\"font: 700 30px var(--mono); color: var(--green);\">&gt;<\/span>\n          <p style=\"margin: 0; font: 400 30px/1.55 var(--sans); color: var(--soft);\">An app is never just code. It drags along a runtime, libraries, config files, and quirks of the machine it grew up on.<\/p>\n        <\/div>\n        <div style=\"display: flex; gap: 24px;\">\n          <span style=\"font: 700 30px var(--mono); color: var(--green);\">&gt;<\/span>\n          <p style=\"margin: 0; font: 400 30px/1.55 var(--sans); color: var(--soft);\">Move it somewhere else and something is missing, or the wrong version, or in the wrong place.<\/p>\n        <\/div>\n        <div style=\"display: flex; gap: 24px;\">\n          <span style=\"font: 700 30px var(--mono); color: var(--green);\">&gt;<\/span>\n          <p style=\"margin: 0; font: 400 30px/1.55 var(--sans); color: var(--ink);\">A container packs the app <em>together with everything it needs<\/em> — one sealed unit that runs the same on any machine.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 5 · WHAT IS A CONTAINER ══════════ -->\n  <section data-label=\"Container\" data-screen-label=\"What a container is\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## concepts<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">What a Container Is<\/h1>\n    <p style=\"margin: 40px 0 0; font: 400 36px/1.5 var(--sans); color: var(--soft); max-width: 1400px;\">A normal process on your machine — running inside its own sealed little world.<\/p>\n    <div style=\"margin-top: 56px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 36px;\">\n        <div style=\"font: 700 30px var(--mono); color: var(--green); letter-spacing: 0.04em;\">isolated<\/div>\n        <p style=\"margin: 20px 0 0; font: 400 28px/1.55 var(--sans); color: var(--soft);\">Its own filesystem, network, and process list. It can’t see the rest of your machine.<\/p>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 36px;\">\n        <div style=\"font: 700 30px var(--mono); color: var(--green); letter-spacing: 0.04em;\">lightweight<\/div>\n        <p style=\"margin: 20px 0 0; font: 400 28px/1.55 var(--sans); color: var(--soft);\">It shares your kernel — no fake hardware, no second OS. Starts in milliseconds.<\/p>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 36px;\">\n        <div style=\"font: 700 30px var(--mono); color: var(--green); letter-spacing: 0.04em;\">portable<\/div>\n        <p style=\"margin: 20px 0 0; font: 400 28px/1.55 var(--sans); color: var(--soft);\">The same image runs identically on any machine with Docker — laptop, server, cloud.<\/p>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: 56px; font: 500 26px/1.7 var(--mono); color: var(--dim);\"># not magic: linux namespaces + cgroups, wearing a friendly interface<\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 6 · VMs ══════════ -->\n  <section data-label=\"VMs\" data-screen-label=\"Containers vs virtual machines\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## concepts<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Containers vs. Virtual Machines<\/h1>\n    <div style=\"margin-top: 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 64px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font: 500 26px var(--mono); color: var(--dim); margin-bottom: 8px;\">virtual machines<\/div>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;\">\n          <div style=\"border: 1px solid var(--green); background: rgba(107,128,84,0.12); border-radius: 10px; padding: 18px 10px; text-align: center; font: 500 25px var(--mono); color: var(--ink);\">app A<\/div>\n          <div style=\"border: 1px solid var(--green); background: rgba(107,128,84,0.12); border-radius: 10px; padding: 18px 10px; text-align: center; font: 500 25px var(--mono); color: var(--ink);\">app B<\/div>\n          <div style=\"border: 1px solid var(--green); background: rgba(107,128,84,0.12); border-radius: 10px; padding: 18px 10px; text-align: center; font: 500 25px var(--mono); color: var(--ink);\">app C<\/div>\n        <\/div>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;\">\n          <div style=\"border: 1px solid var(--amber); background: rgba(222,106,65,0.08); border-radius: 10px; padding: 18px 10px; text-align: center; font: 500 25px var(--mono); color: var(--amber);\">guest OS<\/div>\n          <div style=\"border: 1px solid var(--amber); background: rgba(222,106,65,0.08); border-radius: 10px; padding: 18px 10px; text-align: center; font: 500 25px var(--mono); color: var(--amber);\">guest OS<\/div>\n          <div style=\"border: 1px solid var(--amber); background: rgba(222,106,65,0.08); border-radius: 10px; padding: 18px 10px; text-align: center; font: 500 25px var(--mono); color: var(--amber);\">guest OS<\/div>\n        <\/div>\n        <div style=\"border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 18px 10px; text-align: center; font: 500 25px var(--mono); color: var(--dim);\">hypervisor<\/div>\n        <div style=\"border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 18px 10px; text-align: center; font: 500 25px var(--mono); color: var(--dim);\">host OS<\/div>\n        <div style=\"border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 18px 10px; text-align: center; font: 500 25px var(--mono); color: var(--dim);\">hardware<\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font: 500 26px var(--mono); kshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 7 · IMAGE VS CONTAINER ══════════ -->\n  <section data-label=\"Image vs Container\" data-screen-label=\"Image vs container\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## concepts<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Image vs. Container<\/h1>\n    <div style=\"margin-top: 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 44px;\">\n        <div style=\"font: 700 32px var(--mono); color: var(--green);\">image — the blueprint<\/div>\n        <div style=\"margin-top: 26px; display: flex; flex-direction: column; gap: 16px; font: 400 28px/1.5 var(--sans); color: var(--soft);\">\n          <div>read-only template<\/div>\n          <div>built in layers, shared and cached<\/div>\n          <div>versioned with tags — <span style=\"font: 500 26px var(--mono); color: var(--ink);\">nginx:1.27<\/span><\/div>\n          <div>never changes while containers run<\/div>\n        <\/div>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 44px;\">\n        <div style=\"font: 700 32px var(--mono); color: var(--green);\">container — the running copy<\/div>\n        <div style=\"margin-top: 26px; display: flex; flex-direction: column; gap: 16px; font: 400 28px/1.5 var(--sans); color: var(--soft);\">\n          <div>a live instance of an image<\/div>\n          <div>adds a thin <em>writable<\/em> layer on top<\/div>\n          <div>start, stop, delete freely<\/div>\n          <div>run many from the same image<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: 52px; display: flex; align-items: center; gap: 28px; justify-content: center;\">\n      <div style=\"border: 1px solid var(--green); background: rgba(107,128,84,0.12); border-radius: 10px; padding: 20px 34px; font: 500 26px var(--mono); color: var(--ink);\">image: docker-workshop<\/div>\n      <div style=\"font: 500 30px var(--mono); color: var(--dim);\">→<\/div>\n      <div style=\"border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 20px 28px; font: 500 26px var(--mono); color: var(--soft);\">container: camp<\/div>\n      <div style=\"border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 20px 28px; font: 500 26px var(--mono); color: var(--soft);\">container: camp2<\/div>\n      <div style=\"border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 20px 28px; font: 500 26px var(--mono); color: var(--soft);\">container: test<\/div>\n    <\/div>\n    <div style=\"margin-top: 40px; font: 500 26px var(--mono); color: var(--dim); text-align: center;\"># one blueprint, many running copies<\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 8 · PIPELINE ══════════ -->\n  <section data-label=\"Pipeline\" data-screen-label=\"Where images come from\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## concepts<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Where Images Come From<\/h1>\n    <div style=\"margin-top: 96px; display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n      <div style=\"border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 30px 30px; font: 500 27px var(--mono); color: var(--soft); text-align: center;\">Dockerfile<\/div>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;\"><span style=\"font: 700 24px var(--mono); color: var(--green);\">build<\/span><span style=\"font: 500 28px var(--mono); color: var(--dim); letter-spacing: -0.06em;\">→—→<\/span><\/div>\n      <div style=\"border: 1px solid var(--green); background: rgba(107,128,84,0.12); border-radius: 12px; padding: 30px 30px; font: 500 27px var(--mono); color: var(--ink); text-align: center;\">image<\/div>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;\"><span style=\"font: 700 24px var(--mono); color: var(--green);\">push<\/span><span style=\"font: 500 28px var(--mono); color: var(--dim); letter-spacing: -0.06em;\">→—→<\/span><\/div>\n      <div style=\"border: 1px solid var(--amber); background: rgba(222,106,65,0.08); border-radius: 12px; padding: 30px 30px; font: 500 27px var(--mono); color: var(--amber); text-align: center;\">Docker Hub<div style=\"font: 400 24px var(--mono); color: var(--dim); margin-top: 6px;\">the registry<\/div><\/div>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;\"><span style=\"font: 700 24px var(--mono); color: var(--green);\">pull<\/span><span style=\"font: 500 28px var(--mono); color: var(--dim); letter-spacing: -0.06em;\">→—→<\/span><\/div>\n      <div style=\"border: 1px solid var(--green); background: rgba(107,128,84,0.12); border-radius: 12px; padding: 30px 30px; font: 500 27px var(--mono); color: var(--ink); text-align: center;\">image<\/div>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;\"><span style=\"font: 700 24px var(--mono); color: var(--green);\">run<\/span><span style=\"font: 500 28px var(--mono); color: var(--dim); letter-spacing: -0.06em;\">→—→<\/span><\/div>\n      <div style=\"border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 30px 30px; font: 500 27px var(--mono); color: var(--soft); text-align: center;\">container<\/div>\n    <\/div>\n    <div style=\"margin-top: 100px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 34px 38px;\">\n        <div style=\"font: 700 27px var(--mono); color: var(--green);\">naming<\/div>\n        <p style=\"margin: 16px 0 0; font: 400 27px/1.55 var(--sans); color: var(--soft);\"><span style=\"font: 500 26px var(--mono); color: var(--ink);\">nginx<\/span> — official image. <span style=\"font: 500 26px var(--mono); color: var(--ink);\">vmware/nginx<\/span> — someone’s remix. Check pulls and last-updated before trusting one.<\/p>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 34px 38px;\">\n        <div style=\"font: 700 27px var(--mono); color: var(--green);\">today’s route<\/div>\n        <p style=\"margin: 16px 0 0; font: 400 27px/1.55 var(--sans); color: var(--soft);\">We start on the right — <span style=\"font: 500 26px var(--mono); color: var(--ink);\">pull<\/span> and <span style=\"font: 500 26px var(--mono); color: var(--ink);\">run<\/span> — and end the day on the left, building and pushing our own.<\/p>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 9 · TASK 0 INSTALL ══════════ -->\n  <section data-label=\"Task 0 Install\" data-screen-label=\"Task 0 install docker\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: 80px var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"display: flex; align-items: center; gap: 22px;\">\n      <span style=\"font: 700 26px var(--mono); color: #3a4433; background: var(--amber); padding: 8px 18px; border-radius: 6px; letter-spacing: 0.06em;\">TASK 0<\/span>\n      <span style=\"font: 500 24px var(--mono); color: var(--amber); letter-spacing: 0.08em;\">hands-on — everyone<\/span>\n    <\/div>\n    <h1 style=\"margin: 18px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Install Docker<\/h1>\n    <div style=\"margin-top: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 28px; font: 500 25px/1.6 var(--mono); color: var(--ink);\"><span style=\"color: var(--green);\">$<\/span> docker --version   <span style=\"color: #818678;\"># already prints a version? skip the install — jump straight to hello-world<\/span><\/div>\n    <div style=\"margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n        <div style=\"padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line); font: 500 24px var(--mono); color: var(--green);\">debian / ubuntu<\/div>\n        <pre style=\"margin: 0; padding: 22px 24px; font: 500 24px/1.7 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> sudo apt install docker.io docker-compose-v2<\/pre>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n        <div style=\"padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line); font: 500 24px var(--mono); color: var(--green);\">fedora<\/div>\n        <pre style=\"margin: 0; padding: 22px 24px; font: 500 24px/1.7 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> curl -fsSL https://get.docker.com | sudo sh<\/pre>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n        <div style=\"padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line); font: 500 24px var(--mono); color: var(--green);\">arch<\/div>\n        <pre style=\"margin: 0; padding: 22px 24px; font: 500 24px/1.7 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> sudo pacman -S docker docker-compose<\/pre>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n      <div style=\"display: flex; align-items: center; gap: 9px; padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line);\">\n        <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n        <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n        <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n        <span style=\"margin-left: 10px; font: 500 24px var(--mono); color: var(--dim);\">then, everyone:<\/span>\n      <\/div>\n      <pre style=\"margin: 0; padding: 24px 28px; font: 500 25px/1.8 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> sudo systemctl enable --now docker\n<span style=\"color: var(--green);\">$<\/span> sudo usermod -aG docker $USER   <span style=\"color: #818678;\"># then log out &amp; back in — no more sudo\n<\/span><span style=\"color: var(--green);\">$<\/span> docker run hello-world          <span style=\"color: #818678;\"># prints a greeting = you’re ready<\/span><\/pre>\n    <\/div>\n    <div style=\"margin-top: 20px; font: 500 25px/1.7 var(--mono); color: var(--dim);\"># macOS / windows: install Docker Desktop, rejoin at task 1 · skipped usermod? prefix docker commands with sudo<\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 10 · TASK 1 RUN ══════════ -->\n  <section data-label=\"Task 1 Run\" data-screen-label=\"Task 1 run a container\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: 80px var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"display: flex; align-items: center; gap: 22px;\">\n      <span style=\"font: 700 26px var(--mono); color: #3a4433; background: var(--amber); padding: 8px 18px; border-radius: 6px; letter-spacing: 0.06em;\">TASK 1<\/span>\n      <span style=\"font: 500 24px var(--mono); color: var(--amber); letter-spacing: 0.08em;\">hands-on<\/span>\n    <\/div>\n    <h1 style=\"margin: 18px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Run Somebody Else’s Container<\/h1>\n    <div style=\"margin-top: 44px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 44px; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n          <div style=\"display: flex; align-items: center; gap: 9px; padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line);\">\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"margin-left: 10px; font: 500 24px var(--mono); color: var(--dim);\">you@laptop:~<\/span>\n          <\/div>\n          <pre style=\"margin: 0; padding: 26px 30px; font: 500 23px/1.85 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> docker run -d -p 8080:80 --name camp elohite/docker-workshop\n<span style=\"color: #7a9461;\">Unable to find image locally…\nPulling from elohite/docker-workshop\n9f2a01c4b7de…   <\/span><span style=\"color: #818678;\"># your new container’s id<\/span><\/pre>\n        <\/div>\n        <div style=\"background: var(--panel); border: 1px solid var(--green); border-radius: 12px; padding: 26px 30px; display: flex; align-items: center; gap: 24px;\">\n          <span style=\"font: 700 26px var(--mono); color: var(--green);\">→<\/span>\n          <div style=\"font: 400 28px/1.5 var(--sans); color: var(--ink);\">Open <span style=\"font: 500 26px var(--mono); color: var(--green);\">http://localhost:8080<\/span> — you should see <em>“I was at the Docker workshop”<\/em><\/div>\n        <\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 10px 24px; font: 400 26px/1.5 var(--sans); color: var(--soft); align-items: baseline;\">\n          <span style=\"font: 500 25px var(--mono); color: var(--green);\">run<\/span><span>create a container + start it<\/span>\n          <span style=\"font: 500 25px var(--mono); color: var(--green);\">-d<\/span><span>detached — runs in the background<\/span>\n          <span style=\"font: 500 25px var(--mono); color: var(--green);\">-p 8080:80<\/span><span>your port 8080 → its port 80<\/span>\n          <span style=\"font: 500 25px var(--mono); color: var(--green);\">--name camp<\/span><span>so we can refer to it<\/span>\n          <span style=\"font: 500 25px var(--mono); color: var(--green);\">elohite/…<\/span><span>the image — not on your disk, so Docker pulls it from the Hub<\/span>\n        <\/div>\n        <div style=\"margin-top: 8px; font: 500 25px/1.7 var(--mono); color: var(--dim);\"># one command: fetched, unpacked, running. nothing installed on your machine.<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 11 · CORE LOOP ══════════ -->\n  <section data-label=\"Core Loop\" data-screen-label=\"The core loop\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## reference — type along<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">The Core Loop<\/h1>\n    <p style=\"margin: 36px 0 0; font: 400 32px/1.5 var(--sans); color: var(--soft);\">Run each one now. Watch what changes.<\/p>\n    <div style=\"margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px 40px;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 32px; display: flex; align-items: baseline; gap: 28px;\">\n        <span style=\"font: 500 27px var(--mono); color: var(--green); white-space: nowrap;\">docker ps<\/span>\n        <span style=\"font: 400 26px/1.45 var(--sans); color: var(--soft);\">what’s running right now<\/span>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 32px; display: flex; align-items: baseline; gap: 28px;\">\n        <span style=\"font: 500 27px var(--mono); color: var(--green); white-space: nowrap;\">docker ps -a<\/span>\n        <span style=\"font: 400 26px/1.45 var(--sans); color: var(--soft);\">…including the stopped ones<\/span>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 32px; display: flex; align-items: baseline; gap: 28px;\">\n        <span style=\"font: 500 27px var(--mono); color: var(--green); white-space: nowrap;\">docker logs camp<\/span>\n        <span style=\"font: 400 26px/1.45 var(--sans); color: var(--soft);\">everything it printed — refresh the page, look again<\/span>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 32px; display: flex; align-items: baseline; gap: 28px;\">\n        <span style=\"font: 500 27px var(--mono); color: var(--green); white-space: nowrap;\">docker stop camp<\/span>\n        <span style=\"font: 400 26px/1.45 var(--sans); color: var(--soft);\">pause it — then <span style=\"font: 500 25px var(--mono); color: var(--ink);\">docker start camp<\/span><\/span>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 32px; display: flex; align-items: baseline; gap: 28px;\">\n        <span style=\"font: 500 27px var(--mono); color: var(--green); white-space: nowrap;\">docker rm -f camp<\/span>\n        <span style=\"font: 400 26px/1.45 var(--sans); color: var(--soft);\">delete it, even while running<\/span>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 32px; display: flex; align-items: baseline; gap: 28px;\">\n        <span style=\"font: 500 27px var(--mono); color: var(--green); white-space: nowrap;\">docker images<\/span>\n        <span style=\"font: 400 26px/1.45 var(--sans); color: var(--soft);\">images sitting on your disk<\/span>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: 44px; font: 500 25px/1.7 var(--mono); color: var(--dim);\"># deleted camp? bring it back: docker run -d -p 8080:80 --name camp elohite/docker-workshop<\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 12 · TASK 2 INSIDE ══════════ -->\n  <section data-label=\"Task 2 Inside\" data-screen-label=\"Task 2 look inside\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: 80px var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"display: flex; align-items: center; gap: 22px;\">\n      <span style=\"font: 700 26px var(--mono); color: #3a4433; background: var(--amber); padding: 8px 18px; border-radius: 6px; letter-spacing: 0.06em;\">TASK 2<\/span>\n      <span style=\"font: 500 24px var(--mono); color: var(--amber); letter-spacing: 0.08em;\">hands-on<\/span>\n    <\/div>\n    <h1 style=\"margin: 18px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Look Inside<\/h1>\n    <div style=\"margin-top: 44px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 44px; align-items: start;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n        <div style=\"display: flex; align-items: center; gap: 9px; padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line);\">\n          <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n          <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n          <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n          <span style=\"margin-left: 10px; font: 500 24px var(--mono); color: var(--dim);\">you@laptop:~<\/span>\n        <\/div>\n        <pre style=\"margin: 0; padding: 26px 30px; font: 500 26px/1.85 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> docker exec -it camp bash\n<span style=\"color: var(--amber);\">root@9f2a01c4b7de<\/span>:/# ls /usr/share/nginx/html\n<span style=\"color: #7a9461;\">index.html\n<\/span><span style=\"color: var(--amber);\">root@9f2a01c4b7de<\/span>:/# nano /usr/share/nginx/html/index.html\n<span style=\"color: #818678;\"># change the text · ctrl-o = save · ctrl-x = quit\n<\/span><span style=\"color: var(--amber);\">root@9f2a01c4b7de<\/span>:/# exit<\/pre>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 28px;\">\n        <p style=\"margin: 0; font: 400 29px/1.55 var(--sans); color: var(--soft);\"><span style=\"font: 500 26px var(--mono); color: var(--green);\">exec -it camp bash<\/span> — run a shell <em>inside<\/em> camp, interactive, with a terminal.<\/p>\n        <p style=\"margin: 0; font: 400 29px/1.55 var(--sans); color: var(--soft);\">The new prompt is the container’s own world. Every file you see belongs to it — not to your machine.<\/p>\n        <div style=\"background: var(--panel); border: 1px solid var(--green); border-radius: 12px; padding: 24px 28px; font: 400 27px/1.5 var(--sans); color: var(--ink);\">Now refresh <span style=\"font: 500 25px var(--mono); color: var(--green);\">localhost:8080<\/span> — your words.<\/div>\n        <div style=\"font: 500 25px/1.7 var(--mono); color: var(--dim);\"># nano is only in there because we baked it into this image. stock nginx ships with no editor — remember that.<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 13 · TASK 3 RERUN ══════════ -->\n  <section data-label=\"Task 3 Rerun\" data-screen-label=\"Task 3 delete and run again\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: 80px var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"display: flex; align-items: center; gap: 22px;\">\n      <span style=\"font: 700 26px var(--mono); color: #3a4433; background: var(--amber); padding: 8px 18px; border-radius: 6px; letter-spacing: 0.06em;\">TASK 3<\/span>\n      <span style=\"font: 500 24px var(--mono); color: var(--amber); letter-spacing: 0.08em;\">hands-on<\/span>\n    <\/div>\n    <h1 style=\"margin: 18px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Delete It and Run It Again<\/h1>\n    <div style=\"margin-top: 44px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 44px; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n          <div style=\"display: flex; align-items: center; gap: 9px; padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line);\">\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"margin-left: 10px; font: 500 24px var(--mono); color: var(--dim);\">you@laptop:~<\/span>\n          <\/div>\n          <pre style=\"margin: 0; padding: 26px 30px; font: 500 23px/1.85 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> docker rm -f camp\n<span style=\"color: var(--green);\">$<\/span> docker run -d -p 8080:80 --name camp elohite/docker-workshop<\/pre>\n        <\/div>\n        <div style=\"background: var(--panel); border: 1px solid var(--amber); border-radius: 12px; padding: 26px 30px; display: flex; align-items: center; gap: 24px;\">\n          <span style=\"font: 700 26px var(--mono); color: var(--amber);\">→<\/span>\n          <div style=\"font: 400 28px/1.5 var(--sans); color: var(--ink);\">Refresh <span style=\"font: 500 26px var(--mono); color: var(--amber);\">localhost:8080<\/span> — your edit is <em>gone<\/em>.<\/div>\n        <\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 26px;\">\n        <div style=\"display: flex; gap: 22px; align-items: baseline;\">\n          <span style=\"font: 700 26px var(--mono); color: var(--green);\">1<\/span>\n          <p style=\"margin: 0; font: 400 28px/1.5 var(--sans); color: var(--soft);\">Your edit lived in that container’s thin writable layer.<\/p>\n        <\/div>\n        <div style=\"display: flex; gap: 22px; align-items: baseline;\">\n          <span style=\"font: 700 26px var(--mono); color: var(--green);\">2<\/span>\n          <p style=\"margin: 0; font: 400 28px/1.5 var(--sans); color: var(--soft);\"><span style=\"font: 500 26px var(--mono); color: var(--ink);\">rm -f<\/span> threw the whole container away — layer included.<\/p>\n        <\/div>\n        <div style=\"display: flex; gap: 22px; align-items: baseline;\">\n          <span style=\"font: 700 26px var(--mono); color: var(--green);\">3<\/span>\n          <p style=\"margin: 0; font: 400 28px/1.5 var(--sans); color: var(--soft);\">The image never changed. The new container is a pristine copy.<\/p>\n        <\/div>\n        <div style=\"font: 500 25px/1.7 var(--mono); color: var(--dim);\"># stop + start keeps your edit — same container. deleting is what erases. so: never keep the only copy of anything inside a container.<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 14 · EPHEMERAL ══════════ -->\n  <section data-label=\"Ephemeral\" data-screen-label=\"Ephemeral by design\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## the mental model<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Ephemeral by Design<\/h1>\n    <div style=\"margin-top: 72px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 44px 38px;\">\n        <div style=\"font: 700 30px var(--mono); color: var(--green);\">immutable images<\/div>\n        <p style=\"margin: 22px 0 0; font: 400 28px/1.55 var(--sans); color: var(--soft);\">Running containers never change the image. Want the image different? Rebuild it.<\/p>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 44px 38px;\">\n        <div style=\"font: 700 30px var(--mono); color: var(--green);\">disposable containers<\/div>\n        <p style=\"margin: 22px 0 0; font: 400 28px/1.55 var(--sans); color: var(--soft);\">Cattle, not pets. Delete and recreate without fear — a fresh one is always one command away.<\/p>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 44px 38px;\">\n        <div style=\"font: 700 30px var(--mono); color: var(--green);\">data lives outside<\/div>\n        <p style=\"margin: 22px 0 0; font: 400 28px/1.55 var(--sans); color: var(--soft);\">Anything worth keeping stays on your machine and gets mounted in. That’s a <em>volume<\/em> — next task.<\/p>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 15 · TASK 4 COMPOSE ══════════ -->\n  <section data-label=\"Task 4 Compose\" data-screen-label=\"Task 4 compose\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: 80px var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"display: flex; align-items: center; gap: 22px;\">\n      <span style=\"font: 700 26px var(--mono); color: #3a4433; background: var(--amber); padding: 8px 18px; border-radius: 6px; letter-spacing: 0.06em;\">TASK 4<\/span>\n      <span style=\"font: 500 24px var(--mono); color: var(--amber); letter-spacing: 0.08em;\">hands-on<\/span>\n    <\/div>\n    <h1 style=\"margin: 18px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">The Same Thing, as a File<\/h1>\n    <div style=\"margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n          <div style=\"padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line); font: 500 24px var(--mono); color: var(--amber);\">camp/compose.yaml<\/div>\n          <pre style=\"margin: 0; padding: 24px 30px; font: 500 26px/1.75 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">services<\/span>:\n  <span style=\"color: var(--green);\">web<\/span>:\n    <span style=\"color: var(--dim);\">image<\/span>: elohite/docker-workshop\n    <span style=\"color: var(--dim);\">ports<\/span>:\n      - \"8080:80\"<\/pre>\n        <\/div>\n        <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n          <div style=\"display: flex; align-items: center; gap: 9px; padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line);\">\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"margin-left: 10px; font: 500 24px var(--mono); color: var(--dim);\">you@laptop:~<\/span>\n          <\/div>\n          <pre style=\"margin: 0; padding: 24px 30px; font: 500 26px/1.8 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> mkdir camp &amp;&amp; cd camp\n<span style=\"color: var(--green);\">$<\/span> nano compose.yaml\n<span style=\"color: var(--green);\">$<\/span> docker compose up -d\n<span style=\"color: var(--green);\">$<\/span> docker compose down<\/pre>\n        <\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 32px;\">\n        <p style=\"margin: 0; font: 400 30px/1.55 var(--sans); color: var(--soft);\">That run command was getting long. Compose writes it down instead.<\/p>\n        <div style=\"display: flex; flex-direction: column; gap: 22px; font: 400 28px/1.5 var(--sans); color: var(--soft);\">\n          <div style=\"display: flex; gap: 22px;\"><span style=\"font: 700 28px var(--mono); color: var(--green);\">&gt;<\/span><span>Readable, shareable, lives in git next to your code.<\/span><\/div>\n          <div style=\"display: flex; gap: 22px;\"><span style=\"font: 700 28px var(--mono); color: var(--green);\">&gt;<\/span><span><span style=\"font: 500 26px var(--mono); color: var(--ink);\">up -d<\/span> starts everything in the file. <span style=\"font: 500 26px var(--mono); color: var(--ink);\">down<\/span> stops and cleans it all up.<\/span><\/div>\n          <div style=\"display: flex; gap: 22px;\"><span style=\"font: 700 28px var(--mono); color: var(--green);\">&gt;<\/span><span>The file <em>is<\/em> the documentation of how this thing runs.<\/span><\/div>\n        <\/div>\n        <div style=\"font: 500 25px/1.7 var(--mono); color: var(--dim);\"># on older machines the command is docker-compose (with a hyphen)<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 16 · TASK 5 VOLUME ══════════ -->\n  <section data-label=\"Task 5 Volume\" data-screen-label=\"Task 5 mount a volume\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: 80px var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"display: flex; align-items: center; gap: 22px;\">\n      <span style=\"font: 700 26px var(--mono); color: #3a4433; background: var(--amber); padding: 8px 18px; border-radius: 6px; letter-spacing: 0.06em;\">TASK 5<\/span>\n      <span style=\"font: 500 24px var(--mono); color: var(--amber); letter-spacing: 0.08em;\">hands-on<\/span>\n    <\/div>\n    <h1 style=\"margin: 18px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Mount a Volume<\/h1>\n    <div style=\"margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n          <div style=\"padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line); font: 500 24px var(--mono); color: var(--amber);\">camp/compose.yaml<\/div>\n          <pre style=\"margin: 0; padding: 24px 30px; font: 500 26px/1.6 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">services<\/span>:\n  <span style=\"color: var(--green);\">web<\/span>:\n    <span style=\"color: var(--dim);\">image<\/span>: elohite/docker-workshop\n    <span style=\"color: var(--dim);\">ports<\/span>:\n      - \"8080:80\"\n    <span style=\"color: var(--amber);\">volumes<\/span>:\n      <span style=\"color: var(--amber);\">- ./html:/usr/share/nginx/html<\/span><\/pre>\n        <\/div>\n        <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n          <div style=\"display: flex; align-items: center; gap: 9px; padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line);\">\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"margin-left: 10px; font: 500 24px var(--mono); color: var(--dim);\">you@laptop:~/camp<\/span>\n          <\/div>\n          <pre style=\"margin: 0; padding: 24px 30px; font: 500 25px/1.6 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> mkdir html\n<span style=\"color: var(--green);\">$<\/span> nano html/index.html   <span style=\"color: #818678;\"># write anything\n<\/span><span style=\"color: var(--green);\">$<\/span> docker compose up -d\n<span style=\"color: var(--green);\">$<\/span> docker compose down &amp;&amp; docker compose up -d\n<span style=\"color: #818678;\"># refresh — your page survived<\/span><\/pre>\n        <\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 30px;\">\n        <div style=\"background: var(--panel); border: 1px solid var(--green); border-radius: 14px; padding: 40px 38px;\">\n          <div style=\"font: 700 27px var(--mono); color: var(--green); letter-spacing: 0.06em;\">the colon rule<\/div>\n          <div style=\"margin-top: 28px; display: flex; align-items: baseline; justify-content: center; gap: 18px; flex-wrap: wrap;\">\n            <span style=\"font: 700 30px var(--mono); color: var(--ink);\">./html<\/span>\n            <span style=\"font: 700 34px var(--mono); color: var(--amber);\">:<\/span>\n            <span style=\"font: 700 30px var(--mono); color: var(--ink);\">/usr/share/nginx/html<\/span>\n          <\/div>\n          <div style=\"margin-top: 20px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; font: 500 24px var(--mono); color: var(--dim); text-align: center;\">\n            <span>your machine (host)<\/span><span><\/span><span>inside the container<\/span>\n          <\/div>\n        <\/div>\n        <p style=\"margin: 0; font: 400 29px/1.55 var(--sans); color: var(--soft);\">Left of the colon: your world. Right of it: theirs. Same rule you already used with ports — <span style=\"font: 500 26px var(--mono); color: var(--ink);\">8080:80<\/span>.<\/p>\n        <div style=\"font: 500 25px/1.7 var(--mono); color: var(--dim);\"># the container can be deleted a hundred times. ./html is yours and stays.<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 17 · TWO SERVICES ══════════ -->\n  <section data-label=\"Two Services\" data-screen-label=\"Two services one file\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: 80px var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## demo — watch this one (big download)<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Two Services, One File<\/h1>\n    <div style=\"margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: start;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n        <div style=\"padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line); font: 500 24px var(--mono); color: var(--amber);\">wordpress/compose.yaml<\/div>\n        <pre style=\"margin: 0; padding: 22px 28px; font: 500 24px/1.6 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">services<\/span>:\n  <span style=\"color: var(--green);\">wordpress<\/span>:\n    <span style=\"color: var(--dim);\">image<\/span>: wordpress\n    <span style=\"color: var(--dim);\">ports<\/span>:\n      - \"8081:80\"\n    <span style=\"color: var(--dim);\">environment<\/span>:\n      WORDPRESS_DB_HOST: <span style=\"color: var(--amber);\">db<\/span>\n      WORDPRESS_DB_USER: wp\n      WORDPRESS_DB_PASSWORD: secret\n      WORDPRESS_DB_NAME: wordpress\n  <span style=\"color: var(--green);\">db<\/span>:\n    <span style=\"color: var(--dim);\">image<\/span>: mysql\n    <span style=\"color: var(--dim);\">environment<\/span>:\n      MYSQL_DATABASE: wordpress\n      MYSQL_USER: wp\n      MYSQL_PASSWORD: secret\n      MYSQL_RANDOM_ROOT_PASSWORD: \"1\"<\/pre>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 30px;\">\n        <div style=\"display: flex; gap: 22px;\"><span style=\"font: 700 28px var(--mono); color: var(--green);\">&gt;<\/span><p style=\"margin: 0; font: 400 29px/1.55 var(--sans); color: var(--soft);\">Two containers, one file, one <span style=\"font: 500 26px var(--mono); color: var(--ink);\">docker compose up -d<\/span>.<\/p><\/div>\n        <div style=\"display: flex; gap: 22px;\"><span style=\"font: 700 28px var(--mono); color: var(--green);\">&gt;<\/span><p style=\"margin: 0; font: 400 29px/1.55 var(--sans); color: var(--soft);\">Compose gives them a private network. Each service is reachable <em>by name<\/em> — WordPress finds its database at <span style=\"font: 500 26px var(--mono); color: var(--amber);\">db<\/span>.<\/p><\/div>\n        <div style=\"display: flex; gap: 22px;\"><span style=\"font: 700 28px var(--mono); color: var(--green);\">&gt;<\/span><p style=\"margin: 0; font: 400 29px/1.55 var(--sans); color: var(--soft);\">A whole CMS with a database at <span style=\"font: 500 26px var(--mono); color: var(--ink);\">localhost:8081<\/span> — nothing installed on the machine.<\/p><\/div>\n        <div style=\"font: 500 25px/1.7 var(--mono); color: var(--dim);\"># in real life you’d give db a volume — you know why now<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for the curious<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 18 · TASK 6 BUILD ══════════ -->\n  <section data-label=\"Task 6 Build\" data-screen-label=\"Task 6 build your own image\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: 80px var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"display: flex; align-items: center; gap: 22px;\">\n      <span style=\"font: 700 26px var(--mono); color: #3a4433; background: var(--amber); padding: 8px 18px; border-radius: 6px; letter-spacing: 0.06em;\">TASK 6<\/span>\n      <span style=\"font: 500 24px var(--mono); color: var(--amber); letter-spacing: 0.08em;\">hands-on<\/span>\n    <\/div>\n    <h1 style=\"margin: 18px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Build Your Own Image<\/h1>\n    <div style=\"margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n        <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n          <div style=\"padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line); font: 500 24px var(--mono); color: var(--amber);\">mysite/index.html<\/div>\n          <pre style=\"margin: 0; padding: 20px 28px; font: 500 25px/1.7 var(--mono); color: var(--ink); white-space: pre-wrap;\">&lt;h1&gt;<span style=\"color: var(--amber);\">YOURNAME<\/span> was at the Docker workshop&lt;/h1&gt;<\/pre>\n        <\/div>\n        <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n          <div style=\"padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line); font: 500 24px var(--mono); color: var(--amber);\">mysite/Dockerfile<\/div>\n          <pre style=\"margin: 0; padding: 20px 28px; font: 500 25px/1.7 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">FROM<\/span> nginx:alpine\n<span style=\"color: var(--green);\">COPY<\/span> index.html /usr/share/nginx/html/<\/pre>\n        <\/div>\n        <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\">\n          <div style=\"display: flex; align-items: center; gap: 9px; padding: 12px 20px; background: var(--panel2); border-bottom: 1px solid var(--line);\">\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"width: 13px; height: 13px; border-radius: 50%; background: #b9baae;\"><\/span>\n            <span style=\"margin-left: 10px; font: 500 24px var(--mono); color: var(--dim);\">you@laptop:~/mysite<\/span>\n          <\/div>\n          <pre style=\"margin: 0; padding: 20px 28px; font: 500 25px/1.75 var(--mono); color: var(--ink); white-space: pre-wrap;\"><span style=\"color: var(--green);\">$<\/span> docker build -t <span style=\"color: var(--amber);\">YOU<\/span>/iwasat:1.0 .\n<span style=\"color: var(--green);\">$<\/span> docker run -d -p 8082:80 <span style=\"color: var(--amber);\">YOU<\/span>/iwasat:1.0<\/pre>\n        <\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 14px 26px; font: 400 28px/1.5 var(--sans); color: var(--soft); align-items: baseline;\">\n          <span style=\"font: 500 26px var(--mono); color: var(--green);\">FROM<\/span><span>start from an existing image — don’t build the world<\/span>\n          <span style=\"font: 500 26px var(--mono); color: var(--green);\">COPY<\/span><span>put your file into the image<\/span>\n          <span style=\"font: 500 26px var(--mono); color: var(--green);\">-t …:1.0<\/span><span>name it: <span style=\"font: 500 25px var(--mono); color: var(--ink);\">user/image:tag<\/span><\/span>\n          <span style=\"font: 500 26px var(--mono); color: var(--green); --soft);\">Hver opgave bygger på den forrige. Færdig før tid? Hjælp dem omkring dig — det er den hurtigste måde at lære det to gange på.<\/p>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 36px;\">\n        <div style=\"font: 700 34px var(--mono); color: var(--green);\">sidder du fast?<\/div>\n        <p style=\"margin: 22px 0 0; font: 400 29px/1.55 var(--sans); color: var(--soft);\">Ræk hånden op — jeg kommer forbi. Ingen laptop med? Slå dig sammen med sidemanden og del et tastatur.<\/p>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top: 56px; font: 500 26px/1.7 var(--mono); color: var(--dim);\"># forudsætninger: nysgerrighed (påkrævet) · kaffe eller anden yndlingsdrik (anbefales)<\/div>\n    <div style=\"margin-top: auto; display: flex; justify-content: space-between; font: 500 24px var(--mono); color: var(--faint);\"><span>$ docker for de nysgerrige<\/span><span>docker workshop<\/span><\/div>\n  <\/section>\n\n  <!-- ══════════ 4 · WHY ══════════ -->\n  <section data-label=\"Why\" data-screen-label=\"Hvorfor containere findes\" style=\"background-color: var(--bg); background-image: linear-gradient(rgba(122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## begreber<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Hvorfor containere findes<\/h1>\n    <div style=\"margin-top: 64px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14p (122,148,97,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(122,148,97,0.14) 1px, transparent 1px); background-size: 96px 96px; color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; padding: var(--pad-top) var(--pad-x) 44px; box-sizing: border-box; overflow: hidden;\">\n    <div style=\"font: 500 24px var(--mono); color: var(--green); letter-spacing: 0.1em;\">## begreber<\/div>\n    <h1 style=\"margin: 20px 0 0; font: 800 var(--type-title)/1.12 var(--mono); letter-spacing: -0.01em; color: var(--ink);\">Hvad en container er<\/h1>\n    <p style=\"margin: 40px 0 0; font: 400 36px/1.5 var(--sans); color: var(--soft); max-width: 1400px;\">En helt almindelig proces på din maskine — der kører i sin egen lille forseglede verden.<\/p>\n    <div style=\"margin-top: 56px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px;\">\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 36px;\">\n        <div style=\"font: 700 30px var(--mono); color: var(--green); letter-spacing: 0.04em;\">isoleret<\/div>\n        <p style=\"margin: 20px 0 0; font: 400 28px/1.55 var(--sans); color: var(--soft);\">Sit eget filsystem, netværk og sin egen procesliste. Den kan ikke se resten af din maskine.<\/p>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 36px;\">\n        <div style=\"font: 700 30px var(--mono); color: var(--green); letter-spacing: 0.04em;\">letvægt<\/div>\n        <p style=\"margin: 20px 0 0; font: 400 28px/1.55 var(--sans); color: var(--soft);\">Den deler din kerne — ingen falsk hardware, intet ekstra OS. Starter på millisekunder.<\/p>\n      <\/div>\n      <div style=\"background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 40px 36px;\">\n        <div style=\"font: 700 30px var(--mono); color: var(--green); letter-spacing: 0.04em;\">flytbar<\/div>\n        <p style=\
